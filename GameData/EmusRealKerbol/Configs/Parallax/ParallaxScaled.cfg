// @ParallaxTerrain runs before :FOR, :NEEDS, :AFTER
// Essentially, treat this as part of Parallax itself as if the configs were one
// DO NOT @ParallaxTerrain UNLESS specifying bodies explicitly here
@ParallaxTerrain
{
    // Atmospheric bodies
    @Body[Kerbin]
    {
        // Here is where the usual terrain config goes
        // This patches in the scaled properties
        ParallaxScaledProperties
        {
            // Possible modes:
            // FromTerrain
            // Baked
            // Custom
            // CustomRequiresTerrain

            // Altitude in meters
            minTerrainAltitude = -1388.07
            maxTerrainAltitude = 6744.10

            // We need to use the real mesh for scatterer compatibility
            usingStockMesh:NEEDS[Scatterer] = True

            // Shader modes
            mode = FromTerrain
            Material
            {
                _ColorMap = EmusRealKerbol/Textures/03_Kerbin/PluginData/Kerbin_Color_Scaled.dds
                _BumpMap = EmusRealKerbol/Textures/03_Kerbin/PluginData/Kerbin_Normal.dds
                _HeightMap = EmusRealKerbol/Textures/03_Kerbin/PluginData/Kerbin_Height_Surface.dds
                _AtmosphereRimMap = Parallax_StockPlanetTextures/Kerbin/PluginData/Kerbin_Atmo.dds
                _PlanetBumpScale = 1

                // Keyword params
                _OceanSpecularPower = 0.5
                _OceanSpecularIntensity = 0.35
                _AtmosphereThickness = 1
                _OceanAltitude = 0

                Keywords
                {
                    name = OCEAN_FROM_COLORMAP
                    name:NEEDS[!Scatterer] = ATMOSPHERE
                }
            }
            TerrainMaterialOverride
            {
                // Better normal map for the poles than the sand
                //_MainTexLow = Parallax_StockTerrainTextures/blanknrm.dds
                _BumpMapLow = Parallax_StockTerrainTextures/Kerbin/PluginData/mid01.dds

                _Tiling = 0.0009
                _EnvironmentMapFactor = 0.05
            }
        }
    }

    @Body[Eve]
    {
        // Here is where the usual terrain config goes
        // This patches in the scaled properties
        ParallaxScaledProperties
        {
            // Possible modes:
            // FromTerrain
            // Baked
            // Custom
            // CustomRequiresTerrain

            // Altitude in meters
            minTerrainAltitude = -1870
            maxTerrainAltitude = 7396

            // We need to use the real mesh for scatterer compatibility
            usingStockMesh:NEEDS[Scatterer] = True

            // Shader modes
            mode = FromTerrain
            Material
            {
                _ColorMap = EmusRealKerbol/Textures/02_Eve/PluginData/Eve_Color_Scaled.dds
                _BumpMap = EmusRealKerbol/Textures/02_Eve/PluginData/Eve_Normal.dds
                _HeightMap = EmusRealKerbol/Textures/02_Eve/PluginData/Eve_Height_Surface.dds
                _AtmosphereRimMap = Parallax_StockPlanetTextures/Eve/PluginData/Eve_Atmo.dds
                _PlanetBumpScale = 1

                // Keyword params
                _OceanSpecularPower = 0.5
                _OceanSpecularIntensity = 0.35
                _AtmosphereThickness = 2.0
                _OceanAltitude = 0

                Keywords
                {
                    name = OCEAN_FROM_COLORMAP
                    name:NEEDS[!Scatterer] = ATMOSPHERE
                }
            }
            TerrainMaterialOverride
            {
                _SteepPower = 10
                _Tiling = 0.002
                _EnvironmentMapFactor = 0.0
            }
        }
    }

    // Vacuum Bodies

    @Body[Minmus]
    {
        ParallaxScaledProperties
        {
            minTerrainAltitude = 0
            maxTerrainAltitude = 11000
            mode = FromTerrain

            Material
            {
                _ColorMap = EmusRealKerbol/Textures/04_Minmus/PluginData/Minmus_Color.dds
                _BumpMap = EmusRealKerbol/Textures/04_Minmus/PluginData/Minmus_Normal.dds
                _HeightMap = EmusRealKerbol/Textures/04_Minmus/PluginData/Minmus_Height.dds
                _PlanetBumpScale = 1
                Keywords
                {
                    
                }
            }
            TerrainMaterialOverride
            {
                _Tiling = 0.00033
            }
        }
    }
    
    @Body[Ike]
    {
        ParallaxScaledProperties
        {
            minTerrainAltitude = 73
            maxTerrainAltitude = 12738
            mode = FromTerrain

            Material
            {
                _ColorMap = EmusRealKerbol/Textures/05-1_Ike/PluginData/Ike_Color.dds
                _BumpMap = EmusRealKerbol/Textures/05-1_Ike/PluginData/Ike_Normal.dds
                _HeightMap = EmusRealKerbol/Textures/05-1_Ike/PluginData/Ike_Height.dds
                _PlanetBumpScale = 1.25
                Keywords
                {
                    
                }
            }
            TerrainMaterialOverride
            {
                _Tiling = 0.00035
            }
        }
    }

    @Body[Mun]
    {
        ParallaxScaledProperties
        {
            minTerrainAltitude = -248
            maxTerrainAltitude = 7059
            mode = FromTerrain

            Material
            {
                _ColorMap = EmusRealKerbol/Textures/03-1_Mun/PluginData/Mun_Color.dds
                _BumpMap = EmusRealKerbol/Textures/03-1_Mun/PluginData/Mun_Normal.dds
                _HeightMap = EmusRealKerbol/Textures/03-1_Mun/PluginData/Mun_Height.dds
                _PlanetBumpScale = 1
                Keywords
                {
                    
                }
            }
            TerrainMaterialOverride
            {
                _Tiling = 0.0004
            }
        }
    }
}