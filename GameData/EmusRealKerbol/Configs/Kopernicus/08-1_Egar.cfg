@Kopernicus:AFTER[Kopernicus]
{
    Body 
    {
        Template
		{
			name = Duna
			removeAllPQSMods = true
		}
        name = Egar
        cacheFile = EmusRealKerbol/Cache/Egar.bin
        Properties
        {
            radius = 1559131
            geeASL = 0.214
            displayName = Egar^N
            description = The second-largest moon of Meander, Egar is an interesting contrast. Enormous polar ice caps dominate this moon; half icy wasteland, half frosted desert, and a thin atmosphere to top it off. Not to be confused with Duna, Egar's equator is decorated with eruptions, hot spots and lava lakes. It is the most volcanically active body in the Kerbolar system thanks to its proximity to Meander, just a whisker beyond the roche limit. \n\nIf Egar's landscapes are somehow not alien enough for you, simply gaze upwards as Meander fills the sky with color.
            rotates = True
            tidallyLocked = true
        }
        Orbit
        {
            referenceBody = Meander
            inclination = 5
            eccentricity = 0.01
            semiMajorAxis = 194000000
            longitudeOfAscendingNode = 0
            argumentOfPeriapsis = 268
            meanAnomalyAtEpoch = 0
            // epoch = 4
            color = 0.745, 0.569, 0.306, 1.000
        }
        ScaledVersion
		{
			type = Vacuum
			fadeStart = 140000
			fadeEnd = 170000
			Material
			{
				color = 1,1,1,1
				specColor = 0.0,0.0,0.0,1.0
				shininess = 0.03
				texture = EmusRealKerbol/Textures/08-1_Egar/PluginData/Egar_Color.dds
				mainTexScale = 1,1
				mainTexOffset = 0,0
				normals = EmusRealKerbol/Textures/08-1_Egar/PluginData/Egar_Normal.dds
				bumpMapScale = 1,1
				bumpMapOffset = 0,0
				opacity = 1
			}
			VertexColorMapEmissive:NEEDS[!ParallaxContinued]
			{
				map = EmusRealKerbol/Textures/08-1_Egar/PluginData/Egar_Emission.dds
				brightness = 1
				transparency = 0.5
			} // VertexColorMapEmissive
		}
        PQS
		{
			fadeStart = 175000
            fadeEnd = 195000 
	    	deactivateAltitude = 200000
            minLevel = 2
            maxLevel = 11
			maxMapHeight = 8000
            materialType = AtmosphericTriplanarZoomRotation
			Material
			{
				factor = 8
				factorBlendWidth = 0.05
				factorRotation = 135
				saturation = 1
				contrast = 1
				tintColor = 1,1,1,0
				specularColor = 0.1,0.1,0.1,1
				albedoBrightness = 1
				steepPower = 1.5
				steepTexStart = 10000
				steepTexEnd = 200000
				steepTex = BUILTIN/MunCliff [Diffuse]
				steepTexScale = 1,1
				steepTexOffset = 0,0
				steepBumpMap = BUILTIN/MunCliff [Normal]
				steepBumpMapScale = 1,1
				steepBumpMapOffset = 0,0
				steepNearTiling = 50
				steepTiling = 50
				midTex = BUILTIN/MunFloor [Diffuse]
				midTexScale = 1,1
				midTexOffset = 0,0
				midTiling = 150000
				midBumpMap = BUILTIN/MunFloor [Normal]
				midBumpMapScale = 1,1
				midBumpMapOffset = 0,0
				midBumpTiling = 150000
				lowStart = -1
				lowEnd = -1
				highStart = 2
				highEnd = 2
				globalDensity = 1
				planetOpacity = 1
				oceanFogDistance = 1000
			} // Material
			Mods
			{
				VertexColorMap
				{
					map = EmusRealKerbol/Textures/08-1_Egar/PluginData/Egar_Color.dds
					order = 10
					enabled = True
					name = _Color
				}
				VertexHeightMap
				{
					map = EmusRealKerbol/Textures/08-1_Egar/PluginData/Egar_Height.dds
					offset = 0
					deformity = 25000
					scaleDeformityByRadius = False
					order = 10
					enabled = True
					name = _Height
				}
                VertexColorMapEmissive:NEEDS[!ParallaxContinued]
				{
					order = 60
					enabled = True
					map = EmusRealKerbol/Textures/08-1_Egar/PluginData/Egar_Emission.dds
					brightness = 1
					transparency = 0.6
				} // VertexColorMapEmissive
            }
        }
		Debug
		{
			exportMesh = True // Whether Kopernicus should save a .bin file with the ScaledSpace mesh.
			update = False // Setting this to true will force Kopernicus to update the ScaledSpace mesh.
			showSOI = False
		}
    }
}