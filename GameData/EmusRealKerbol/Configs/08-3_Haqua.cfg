        {
            radius = 1029664
            geeASL = 0.123
            displayName = Haqua^N
            description = Icy Haqua is caught right in the middle of the drama, being tugged at by Vall and Lumowan at irregular intervals as they orbit. This squeezing and stretching heats up the moon, bringing its subsurface ocean to the surface and forming a thin atmosphere. This atmosphere, along with an abundance of salt, allows Haqua to sustain seas of liquid water, despite its distance from Kerbol. \n\nScientists speculate that the view from Haqua's shores with Meander and its moons overhead must be "quite something".
