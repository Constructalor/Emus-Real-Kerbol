@Kopernicus:FOR[ERK]
{
    Body
    {
        Template
		{
			name = Eve
			removeAllPQSMods = true
		}
        name = Eve
        cacheFile = EmusRealKerbol/Cache/Eve.bin
        Properties
        {
            radius = 7740000
            geeASL = 1.28
            displayName = Eve^N
            description = Eve is the largest terrestrial planet in the Kerbolar system and gets its name from being known as the "evening star" by the average kerbal. It can be seen hanging out low on the horizon around dusk or dawn depending on the time of year. \n\nMuch like Kerbin, Eve shares the same water oceans and striking blue colors. However, Eve is not the dream getaway you might think. It's much hotter than Kerbin due to being much closer to Kerbol and its thick atmosphere 7 times the pressure of Kerbin's atmosphere will turn any ill-prepared adventures into one-way trips.
			rotates = true
            rotationPeriod = 125200
        }
        Orbit
        {
            referenceBody = Sun
            inclination = 0.2
            eccentricity = 0.01
            semiMajorAxis = 98300000000
            longitudeOfAscendingNode = 1
            argumentOfPeriapsis = 2
            meanAnomalyAtEpoch = 3
            // epoch = 4
            color = 0.478, 0.478, 1.000, 1.000
        }
        ScaledVersion
		{
			type = Vacuum
			fadeStart = 200000
			fadeEnd = 230000
			Material
			{
				texture = EmusRealKerbol/Textures/02_Eve/PluginData/Eve_Color.dds
				normals = EmusRealKerbol/Textures/02_Eve/PluginData/Eve_Normal.dds

                color = 1,1,1,1
				specColor = 0.08,0.07,0.053,1
				shininess = 0.7
				
				rimPower = 1.5
				rimBlend = 0.5
				rimColorRamp = BUILTIN/AerialRampKerbin2
			}
